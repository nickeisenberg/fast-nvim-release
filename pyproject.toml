[build-system]
# pinned: a release in years to come must build exactly as it does today
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nvim-bin"
description = "Neovim from PyPI: official builds as wheels, installed with one setup command."
readme = "README.md"
requires-python = ">=3.9"
# MIT for this tool; Apache-2.0 AND Vim for the bundled Neovim
license = "MIT AND Apache-2.0 AND Vim"
# a wheel's build tree holds only its own line's Neovim license
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/nvim_bin/_nvim/LICENSE.nvim-*.txt",
]
authors = [{ name = "nvim-bin contributors" }]
keywords = ["neovim", "nvim", "editor", "binary", "wheels", "vim"]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://github.com/nickeisenberg/nvim-bin"
Issues = "https://github.com/nickeisenberg/nvim-bin/issues"
Source = "https://github.com/nickeisenberg/nvim-bin"

[project.scripts]
nvim-bin = "nvim_bin.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "TID"]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "E501",
]


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
