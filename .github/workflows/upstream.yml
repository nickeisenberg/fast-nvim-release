name: upstream

# Neovim ships patch releases every few weeks (and its glibc 2.17 builds in
# neovim-releases follow later), and nothing else here would notice. Every
# Monday this runs `python -m release_tool lines update`: pins move to the newest patches,
# with the checksums GitHub publishes (a new patch is a new package version;
# the revision stays). Any change becomes a pull request (branch pins/update)
# with CI started on it; merging it and running the release workflow publishes
# the new versions.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Settings > Actions > General.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC (off the hour; GitHub's busiest time)
  workflow_dispatch:

permissions:
  contents: write  # push the pin branch
  pull-requests: write  # open its PR
  actions: write  # start CI on it (PRs opened by the bot do not trigger CI)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pins:
    name: bump pins to Neovim's newest patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # standard library only: nothing to install
      - name: move the pins to the newest patches
        run: python -m release_tool lines update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: open (or refresh) the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a new line also brings its (untracked) LICENSE.nvim-<line>.txt
          git add lines.json src/nvim_bin/_nvim/
          if git diff --cached --quiet; then echo "every pin is current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C pins/update
          git commit -m "pins: move to Neovim's newest patches"
          git push --force origin pins/update
          gh pr view pins/update >/dev/null 2>&1 || gh pr create --head pins/update \
            --title "pins: move to Neovim's newest patches" \
            --body "Opened by the weekly upstream check. Review lines.json, wait for CI, merge, then run the release workflow."
          gh workflow run ci.yml --ref pins/update
