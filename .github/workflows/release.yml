name: release

# Started by hand only (Actions > release > Run workflow). It publishes every
# wheel in lines.json that the chosen index does not have yet: a new Neovim
# patch, every line after a revision bump, or old-glibc wheels joining an
# existing version. Publishing is irreversible (an index never takes the same
# file twice); rehearse on TestPyPI first.
#
# Only wheels are ever published, never an sdist: pip on an older Linux skips
# a version with no wheel it can use (0.12.6.1) and falls back to the one that
# has its old-glibc wheels (0.12.5.1); with an sdist it would try to build it.
#
# If the publish or GitHub release job fails, use "Re-run failed jobs" (the
# wheels artifact lasts 14 days): the upload skips files the index already
# has, and the release notes cover every wheel of the run. A fresh run would
# only see what is still unpublished and leave the rest out of the notes.

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

# a release must never be cancelled half way through a publish
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NVIM_CACHE: ~/.cache/nvim-bin
  INDEX_URL: ${{ inputs.index == 'pypi' && 'https://pypi.org' || 'https://test.pypi.org' }}

jobs:
  build:
    name: build the unpublished wheels
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: release only what master has
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::release runs from master only, not ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: unit tests
        run: python -m pytest -q
      - name: restore the Neovim archive cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.NVIM_CACHE }}
          key: nvim-release-${{ hashFiles('lines.json') }}
      - name: build every wheel the index does not have
        id: build
        run: |
          python -m release_tool build --all --skip-published "$INDEX_URL"
          if ls dist/*.whl >/dev/null 2>&1; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi
      - name: validate metadata, payloads and tags
        if: steps.build.outputs.built == 'true'
        run: |
          python -m twine check dist/*
          python -m release_tool check
      - name: install the Linux x86_64 wheels in a clean venv and use them
        if: steps.build.outputs.built == 'true'
        # either kind may be missing (only old-glibc wheels joining a version)
        run: |
          shopt -s nullglob
          wheels=(dist/*-manylinux_2_34_x86_64.whl dist/*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl)
          if [ ${#wheels[@]} -gt 0 ]; then python -m release_tool smoke "${wheels[@]}"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.build.outputs.built == 'true'
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 14

  publish:
    name: publish to ${{ inputs.index }}
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/p/nvim-bin' || 'https://test.pypi.org/p/nvim-bin' }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist
      - name: validate the wheels before uploading
        run: python -m release_tool check dist/*.whl
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: dist
          attestations: true
          # a re-run after a partial upload sends only the files still missing
          skip-existing: true

  github-release:
    name: tag and describe the release
    needs: publish
    # rehearsals on TestPyPI leave no tags behind
    if: inputs.index == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: dist
      - name: one GitHub release per published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -m release_tool release-notes dist/*.whl
